name: Probe FSQ OS catalog

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FSQ_CATALOG_URI: ${{ vars.FSQ_CATALOG_URI }}
      FSQ_CATALOG_TOKEN: ${{ secrets.FSQ_CATALOG_TOKEN }}
      FSQ_PLACES_TABLE: ${{ vars.FSQ_PLACES_TABLE }}
      FSQ_CATALOG_WAREHOUSE: ${{ vars.FSQ_CATALOG_WAREHOUSE }}
    steps:
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Install bounded catalog client
        run: pip install "pyiceberg>=0.9,<1" "pyarrow>=18,<21"

      - name: Validate catalog and sample twenty current Paloma candidates
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import re
          from datetime import date, datetime, timedelta

          from pyiceberg.catalog import load_catalog
          from pyiceberg.expressions import (
              And,
              EqualTo,
              GreaterThanOrEqual,
              LessThanOrEqual,
          )


          required_config = (
              "FSQ_CATALOG_URI",
              "FSQ_CATALOG_TOKEN",
              "FSQ_PLACES_TABLE",
              "FSQ_CATALOG_WAREHOUSE",
          )
          missing = [name for name in required_config if not os.environ.get(name)]
          if missing:
              raise SystemExit("Missing GitHub configuration: " + ", ".join(missing))

          catalog = load_catalog(
              "fsq",
              **{
                  "type": "rest",
                  "warehouse": os.environ["FSQ_CATALOG_WAREHOUSE"],
                  "uri": os.environ["FSQ_CATALOG_URI"],
                  "token": os.environ["FSQ_CATALOG_TOKEN"],
                  "header.content-type": "application/vnd.api+json",
                  "rest-metrics-reporting-enabled": "false",
              },
          )
          table = catalog.load_table(os.environ["FSQ_PLACES_TABLE"])
          available = {field.name for field in table.schema().fields}
          selected = [
              name
              for name in (
                  "fsq_place_id",
                  "name",
                  "address",
                  "locality",
                  "region",
                  "latitude",
                  "longitude",
                  "date_refreshed",
                  "date_closed",
                  "fsq_category_labels",
                  "fsq_category_ids",
                  "unresolved_flags",
                  "postcode",
                  "tel",
                  "website",
              )
              if name in available
          ]
          required_fields = {
              "fsq_place_id",
              "name",
              "address",
              "locality",
              "region",
              "latitude",
              "longitude",
              "fsq_category_labels",
          }
          missing_fields = sorted(required_fields - available)
          if missing_fields:
              raise SystemExit("FSQ schema is missing: " + ", ".join(missing_fields))

          # Push geography into Iceberg, then apply the same consumer-category, freshness,
          # closure, address, and quality gates used by Paloma. This remains read-only.
          row_filter = And(
              And(
                  And(
                      GreaterThanOrEqual("longitude", -123.2),
                      LessThanOrEqual("longitude", -121.1),
                  ),
                  And(
                      GreaterThanOrEqual("latitude", 36.8),
                      LessThanOrEqual("latitude", 38.9),
                  ),
              ),
              EqualTo("locality", "San Francisco"),
          )
          scan = table.scan(
              row_filter=row_filter,
              selected_fields=selected,
          )

          exact_category_tokens = {
              "bar",
              "beer_bar",
              "beer_garden",
              "brew_pub",
              "brewery",
              "brewpub",
              "cocktail_bar",
              "distillery",
              "dive_bar",
              "drinking_place",
              "drinking_places",
              "gastropub",
              "hotel_bar",
              "irish_pub",
              "lounge",
              "night_club",
              "nightclub",
              "pub",
              "rooftop_bar",
              "sports_bar",
              "speakeasy",
              "tap_room",
              "taproom",
              "tasting_room",
              "tiki_bar",
              "wine_bar",
              "winery",
          }
          hard_negative_flags = {
              "closed",
              "delete",
              "doesntexist",
              "doesnt_exist",
              "doesnotexist",
              "does_not_exist",
              "duplicate",
              "inappropriate",
              "privatevenue",
              "private_venue",
          }
          freshness_cutoff = date.today() - timedelta(days=365)

          def string_list(value):
              if value is None:
                  return []
              if isinstance(value, (list, tuple, set)):
                  return [str(item).strip() for item in value if str(item).strip()]
              text = str(value).strip()
              return [text] if text else []

          def tokens(values):
              result = set()
              for value in string_list(values):
                  for part in re.split(r"\s*(?:>|/|›)\s*", value):
                      token = re.sub(r"[^a-z0-9]+", "_", part.casefold()).strip("_")
                      if token:
                          result.add(token)
              return result

          def as_date(value):
              if isinstance(value, datetime):
                  return value.date()
              if isinstance(value, date):
                  return value
              if not value:
                  return None
              return date.fromisoformat(str(value)[:10])

          rows = []
          rows_considered = 0
          for batch in scan.to_arrow_batch_reader():
              for row in batch.to_pylist():
                  rows_considered += 1
                  flags = tokens(row.get("unresolved_flags"))
                  category_tokens = tokens(row.get("fsq_category_labels"))
                  refreshed = as_date(row.get("date_refreshed"))
                  if not row.get("name") or not row.get("address"):
                      continue
                  if row.get("date_closed") is not None:
                      continue
                  if refreshed is None or refreshed < freshness_cutoff:
                      continue
                  if flags & hard_negative_flags:
                      continue
                  if not category_tokens & exact_category_tokens:
                      continue
                  rows.append(row)
                  if len(rows) == 20:
                      break
              if len(rows) == 20:
                  break
          if not rows:
              raise SystemExit("Catalog connected, but the guarded San Francisco query returned zero rows")

          print(
              json.dumps(
                  {
                      "catalog_connected": True,
                      "table": os.environ["FSQ_PLACES_TABLE"],
                      "schema_field_count": len(available),
                      "sample_count": len(rows),
                      "source_rows_considered": rows_considered,
                      "gates": [
                          "locality=San Francisco",
                          "current within 365 days",
                          "not closed",
                          "consumer drinking category",
                          "name and street address present",
                          "no unresolved private/closed/duplicate/delete flag",
                      ],
                      "sample": rows,
                      "database_writes": False,
                      "publication_mutated": False,
                  },
                  default=str,
                  indent=2,
                  sort_keys=True,
              )
          )
          PY
