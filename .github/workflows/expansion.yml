name: Controlled catalog expansion

on:
  workflow_dispatch:
    inputs:
      action:
        description: Expansion action
        required: true
        default: status
        type: choice
        options: [status, discover, trial, verify, reevaluate, audit, resolve-review, review-field-conflict, attest, observe-field, observe-manifest, publish]
      release_id:
        description: Versioned bounded release
        required: true
        default: east-bay-pilot-v1
        type: choice
        options: [east-bay-pilot-v1, east-bay-sr-dublin-v1, south-bay-pilot-v1, peninsula-pilot-v1, north-bay-pilot-v1]
      city:
        description: Exact scoped city, or the establishment city for conflict review
        required: false
        default: Oakland
        type: string
      limit:
        description: Candidate or API-call limit
        required: false
        default: '25'
        type: string
      confirmation:
        description: Required action token; see the expansion runbook
        required: false
        default: ''
        type: string
      candidate_id:
        description: Exact private candidate UUID for attest
        required: false
        default: ''
        type: string
      review_id:
        description: Exact pending match-review ID for resolve-review
        required: false
        default: ''
        type: string
      resolution:
        description: Human match decision for resolve-review
        required: false
        default: not_same_or_stale
        type: choice
        options: [not_same_or_stale, same_place]
      review_note:
        description: Short rationale for the match decision
        required: false
        default: ''
        type: string
      conflict_id:
        description: Exact pending field-conflict ID for review-field-conflict
        required: false
        default: ''
        type: string
      selected_evidence_id:
        description: Optional current evidence UUID to select for the field conflict
        required: false
        default: ''
        type: string
      field_review_note:
        description: Short rationale for the field-conflict decision
        required: false
        default: ''
        type: string
      venue_type:
        description: Reviewed consumer venue type override for attest (optional)
        required: false
        default: ''
        type: string
      attestation_outcome:
        description: Current venue passes or has an explicit hard negative
        required: false
        default: pass
        type: choice
        options: [pass, fail]
      evidence_urls:
        description: JSON array of current authoritative HTTPS URLs for attest
        required: false
        default: '[]'
        type: string
      attestation_note:
        description: Short rationale; do not copy provider detail fields
        required: false
        default: ''
        type: string
      field_name:
        description: Atomic field for observe-field
        required: false
        default: hours
        type: choice
        options: [phone_e164, website_url, neighborhood, hours, price_level, setting_slug]
      field_value_json:
        description: JSON scalar/object/array for observe-field
        required: false
        default: 'null'
        type: string
      field_lease_days:
        description: Optional lease no longer than the source policy permits
        required: false
        default: ''
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: paloma-catalog-expansion
  cancel-in-progress: false

jobs:
  expansion:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      PALOMA_COUNTRIES: US
      PALOMA_REGIONS: CA
      PALOMA_CITIES: San Francisco,Oakland,Berkeley,San Jose,San Mateo,Palo Alto,Mountain View,Sunnyvale,Santa Clara,Redwood City,Napa,Sonoma,Dublin,San Ramon
      PALOMA_OVERTURE_BBOX: -123.2,36.8,-121.1,38.9
      FSQ_CATALOG_URI: ${{ vars.FSQ_CATALOG_URI }}
      FSQ_CATALOG_TOKEN: ${{ secrets.FSQ_CATALOG_TOKEN }}
      FSQ_PLACES_TABLE: ${{ vars.FSQ_PLACES_TABLE }}
      FSQ_CATALOG_WAREHOUSE: ${{ vars.FSQ_CATALOG_WAREHOUSE }}
      FSQ_PLACES_API_KEY: ${{ secrets.FSQ_PLACES_API_KEY }}
      FSQ_SERVER_STORAGE_LICENSED: ${{ vars.FSQ_SERVER_STORAGE_LICENSED }}
      CATALOG_PROVIDER_LEASE_DAYS: '45'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-data-worker
      - name: Validate release scope and execute action
        shell: bash
        env:
          ACTION: ${{ inputs.action }}
          RELEASE_ID: ${{ inputs.release_id }}
          CITY: ${{ inputs.city }}
          LIMIT: ${{ inputs.limit }}
          CONFIRMATION: ${{ inputs.confirmation }}
          CANDIDATE_ID: ${{ inputs.candidate_id }}
          REVIEW_ID: ${{ inputs.review_id }}
          RESOLUTION: ${{ inputs.resolution }}
          REVIEW_NOTE: ${{ inputs.review_note }}
          CONFLICT_ID: ${{ inputs.conflict_id }}
          SELECTED_EVIDENCE_ID: ${{ inputs.selected_evidence_id }}
          FIELD_REVIEW_NOTE: ${{ inputs.field_review_note }}
          VENUE_TYPE: ${{ inputs.venue_type }}
          ATTESTATION_OUTCOME: ${{ inputs.attestation_outcome }}
          EVIDENCE_URLS: ${{ inputs.evidence_urls }}
          ATTESTATION_NOTE: ${{ inputs.attestation_note }}
          FIELD_NAME: ${{ inputs.field_name }}
          FIELD_VALUE_JSON: ${{ inputs.field_value_json }}
          FIELD_LEASE_DAYS: ${{ inputs.field_lease_days }}
          REVIEWER: github:${{ github.actor }}
        run: |
          set -euo pipefail
          if [[ ! "$LIMIT" =~ ^[1-9][0-9]*$ ]] || (( LIMIT > 2000 )); then
            echo "limit must be an integer from 1 through 2000" >&2
            exit 2
          fi
          case "$ACTION" in
            resolve-review|review-field-conflict)
              CITY="$CITY" python - <<'PY'
          import os

          allowed = {
              city.strip().casefold()
              for city in os.environ["PALOMA_CITIES"].split(",")
              if city.strip()
          }
          if os.environ["CITY"].casefold() not in allowed:
              raise SystemExit(f"{os.environ['CITY']} is outside the configured maintenance region")
          PY
              ;;
            status|publish|observe-manifest)
              ;;
            *)
              RELEASE_ID="$RELEASE_ID" CITY="$CITY" python - <<'PY'
          import os
          from paloma_data.expansion import load_expansion_manifest

          release = load_expansion_manifest().release(os.environ["RELEASE_ID"])
          if os.environ["CITY"].casefold() not in {city.casefold() for city in release.cities}:
              raise SystemExit(
                  f"{os.environ['CITY']} is outside {release.release_id}: "
                  + ", ".join(release.cities)
              )
          PY
              ;;
          esac
          case "$ACTION" in
            status)
              paloma-data expansion-status --release-id "$RELEASE_ID"
              ;;
            discover)
              paloma-data catalog-discover --city "$CITY" --limit "$LIMIT"
              ;;
            trial)
              paloma-data catalog-trial --city "$CITY" --limit "$LIMIT"
              ;;
            verify)
              paloma-data catalog-verify --city "$CITY" --limit "$LIMIT"
              ;;
            reevaluate)
              paloma-data catalog-reevaluate --city "$CITY" --limit "$LIMIT"
              ;;
            audit)
              paloma-data catalog-audit --city "$CITY" --limit "$LIMIT"
              ;;
            resolve-review)
              test "$CONFIRMATION" = "RESOLVE_MATCH_REVIEW"
              test -n "$REVIEW_ID"
              ARGS=(
                --review-id "$REVIEW_ID"
                --resolution "$RESOLUTION"
                --reviewer "$REVIEWER"
                --city "$CITY"
                --confirm "$CONFIRMATION"
              )
              if [ -n "$REVIEW_NOTE" ]; then
                ARGS+=(--note "$REVIEW_NOTE")
              fi
              paloma-data catalog-review-resolve "${ARGS[@]}"
              ;;
            review-field-conflict)
              test "$CONFIRMATION" = "REVIEW_FIELD_CONFLICT"
              [[ "$CONFLICT_ID" =~ ^[1-9][0-9]*$ ]]
              test -n "$FIELD_REVIEW_NOTE"
              ARGS=(
                --conflict-id "$CONFLICT_ID"
                --city "$CITY"
                --reviewer "$REVIEWER"
                --notes "$FIELD_REVIEW_NOTE"
                --confirm "$CONFIRMATION"
              )
              if [ -n "$SELECTED_EVIDENCE_ID" ]; then
                ARGS+=(--selected-evidence-id "$SELECTED_EVIDENCE_ID")
              fi
              paloma-data review-field-conflict "${ARGS[@]}"
              ;;
            attest)
              test "$CONFIRMATION" = "MANUAL_ATTESTATION"
              test -n "$CANDIDATE_ID"
              mapfile -t EVIDENCE < <(python - <<'PY'
          import json
          import os

          values = json.loads(os.environ["EVIDENCE_URLS"])
          if not isinstance(values, list) or not values or len(values) > 10:
              raise SystemExit("evidence_urls must be a JSON array with 1-10 values")
          for value in values:
              if not isinstance(value, str) or "\n" in value or "\r" in value:
                  raise SystemExit("each evidence URL must be one line of text")
              print(value)
          PY
              )
              ARGS=(
                --candidate-id "$CANDIDATE_ID"
                --reviewer "$REVIEWER"
                --city "$CITY"
                --outcome "$ATTESTATION_OUTCOME"
                --confirm "$CONFIRMATION"
              )
              for url in "${EVIDENCE[@]}"; do
                ARGS+=(--evidence-url "$url")
              done
              if [ -n "$VENUE_TYPE" ]; then
                ARGS+=(--venue-type "$VENUE_TYPE")
              fi
              if [ -n "$ATTESTATION_NOTE" ]; then
                ARGS+=(--note "$ATTESTATION_NOTE")
              fi
              paloma-data catalog-attest "${ARGS[@]}"
              ;;
            observe-field)
              test "$CONFIRMATION" = "RECORD_FIELD_OBSERVATION"
              test -n "$CANDIDATE_ID"
              mapfile -t EVIDENCE < <(python - <<'PY'
          import json
          import os

          values = json.loads(os.environ["EVIDENCE_URLS"])
          if not isinstance(values, list) or not values or len(values) > 10:
              raise SystemExit("evidence_urls must be a JSON array with 1-10 values")
          for value in values:
              if not isinstance(value, str) or "\n" in value or "\r" in value:
                  raise SystemExit("each evidence URL must be one line of text")
              print(value)
          PY
              )
              ARGS=(
                --candidate-id "$CANDIDATE_ID"
                --field-name "$FIELD_NAME"
                --value-json "$FIELD_VALUE_JSON"
                --reviewer "$REVIEWER"
                --city "$CITY"
                --confirm "$CONFIRMATION"
              )
              for url in "${EVIDENCE[@]}"; do
                ARGS+=(--evidence-url "$url")
              done
              if [ -n "$ATTESTATION_NOTE" ]; then
                ARGS+=(--note "$ATTESTATION_NOTE")
              fi
              if [ -n "$FIELD_LEASE_DAYS" ]; then
                if [[ ! "$FIELD_LEASE_DAYS" =~ ^[1-9][0-9]*$ ]] || (( FIELD_LEASE_DAYS > 365 )); then
                  echo "field_lease_days must be an integer from 1 through 365" >&2
                  exit 2
                fi
                ARGS+=(--lease-days "$FIELD_LEASE_DAYS")
              fi
              paloma-data catalog-observe-field "${ARGS[@]}"
              ;;
            observe-manifest)
              test "$CONFIRMATION" = "RECORD_FIELD_MANIFEST"
              paloma-data catalog-observe-manifest \
                --reviewer "$REVIEWER" \
                --confirm "$CONFIRMATION"
              ;;
            publish)
              test "$CONFIRMATION" = "PUBLISH_VERIFIED"
              paloma-data expansion-status --release-id "$RELEASE_ID" --require-ready
              paloma-data catalog-publish \
                --release-id "$RELEASE_ID" \
                --confirm "$CONFIRMATION" \
                --limit "$LIMIT"
              ;;
          esac
