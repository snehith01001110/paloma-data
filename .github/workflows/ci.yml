name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
          cache: pip
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.5
      - run: pip install -e '.[dev]'
      - run: ruff check .
      - run: pytest -q
      - run: deno fmt --check supabase/functions/venue-live-details supabase/functions/paloma-data-progress/index.ts
      - run: deno lint supabase/functions/venue-live-details supabase/functions/paloma-data-progress/index.ts
      - run: deno check supabase/functions/venue-live-details/index.ts supabase/functions/venue-live-details/provider_cache.ts supabase/functions/paloma-data-progress/index.ts
      - run: deno test supabase/functions/venue-live-details
      - run: node scripts/check_dashboard.mjs
