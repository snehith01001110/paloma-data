name: Establishment sync

on:
  workflow_dispatch:
    inputs:
      mode:
        description: backfill or sync
        required: true
        default: sync
        type: choice
        options: [sync, backfill]
      source:
        description: Source to run
        required: true
        default: all
        type: choice
        options: [all, ca_abc, datasf, overture]
  schedule:
    # Government sources refresh frequently.
    - cron: '30 16 * * 1-5'
    # Overture publishes monthly. Run late in the month; the official client resolves latest STAC.
    - cron: '0 11 25 * *'

concurrency:
  group: paloma-establishment-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      PALOMA_COUNTRIES: US
      PALOMA_REGIONS: CA
      PALOMA_CITIES: San Francisco,Oakland,Berkeley,San Jose,San Mateo,Palo Alto,Mountain View,Sunnyvale,Santa Clara,Redwood City,Napa,Sonoma
      PALOMA_OVERTURE_BBOX: -123.2,36.8,-121.1,38.9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Require server database secret
        run: test -n "$SUPABASE_DB_URL"
      - run: pip install .
      - name: Run weekday government reconciliation
        if: github.event_name == 'schedule' && github.event.schedule == '30 16 * * 1-5'
        run: paloma-data sync-government
      - name: Run monthly Overture reconciliation
        if: github.event_name == 'schedule' && github.event.schedule == '0 11 25 * *'
        run: paloma-data sync overture
      - name: Run manual command
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          if [ "${{ inputs.mode }}" = "backfill" ]; then
            if [ "${{ inputs.source }}" = "all" ]; then
              paloma-data backfill ca_abc
              paloma-data backfill datasf
              paloma-data backfill overture
            else
              paloma-data backfill "${{ inputs.source }}"
            fi
          else
            if [ "${{ inputs.source }}" = "all" ]; then
              paloma-data sync-all
            else
              paloma-data sync "${{ inputs.source }}"
            fi
          fi
