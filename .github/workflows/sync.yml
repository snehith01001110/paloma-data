name: Verified establishment catalog

on:
  workflow_dispatch:
    inputs:
      action:
        description: Safe catalog action
        required: true
        default: status
        type: choice
        options: [status, coverage, resolve-fields, audit, resolve-review, stage, neighborhoods, discover, trial, trial-verified, verify, reevaluate, publish, provider-links, provider-audit, queue-refresh, queue-work, queue-status, deploy-worker, cutover]
      source:
        description: Source for stage
        required: false
        default: ca_abc
        type: choice
        options: [ca_abc, datasf, fsq, overture, wikidata]
      city:
        description: Exact city for discover/trial/verify
        required: false
        default: San Francisco
        type: string
      limit:
        description: Candidate/API call limit
        required: false
        default: '20'
        type: string
      confirmation:
        description: Required confirmation token for destructive/curated actions
        required: false
        default: ''
        type: string
      review_id:
        description: Match-review ID for resolve-review
        required: false
        default: ''
        type: string
      resolution:
        description: Human decision for resolve-review
        required: false
        default: not_same_or_stale
        type: choice
        options: [not_same_or_stale, same_place]
  schedule:
    # High-risk regulatory status must remain inside the seven-day freshness contract.
    - cron: '30 14 * * 1,4'
    # Durable/open sources change slowly. Refresh monthly without discovering or publishing venues.
    - cron: '30 14 1 * *'
    # Queue the fail-closed lease sweep shortly before the daily managed worker runs.
    - cron: '45 14 * * *'

permissions:
  contents: read
  id-token: write

concurrency:
  group: paloma-verified-catalog
  cancel-in-progress: false

jobs:
  catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      PALOMA_COUNTRIES: US
      PALOMA_REGIONS: CA
      PALOMA_CITIES: San Francisco,Oakland,Berkeley,San Jose,San Mateo,Palo Alto,Mountain View,Sunnyvale,Santa Clara,Redwood City,Napa,Sonoma
      PALOMA_OVERTURE_BBOX: -123.2,36.8,-121.1,38.9
      FSQ_CATALOG_URI: ${{ vars.FSQ_CATALOG_URI }}
      FSQ_CATALOG_TOKEN: ${{ secrets.FSQ_CATALOG_TOKEN }}
      FSQ_PLACES_TABLE: ${{ vars.FSQ_PLACES_TABLE }}
      FSQ_CATALOG_WAREHOUSE: ${{ vars.FSQ_CATALOG_WAREHOUSE }}
      FSQ_PLACES_API_KEY: ${{ secrets.FSQ_PLACES_API_KEY }}
      YELP_API_KEY: ${{ secrets.YELP_API_KEY }}
      FSQ_SERVER_STORAGE_LICENSED: ${{ vars.FSQ_SERVER_STORAGE_LICENSED }}
      PALOMA_CATALOG_AUTO_PUBLISH: ${{ vars.PALOMA_CATALOG_AUTO_PUBLISH }}
      CATALOG_PROVIDER_LEASE_DAYS: '45'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Install locked runtime
        shell: bash
        run: |
          python -m pip install 'uv==0.11.6'
          uv sync --frozen --no-dev --extra fsq
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
      - name: Exchange GitHub OIDC for scoped database credential
        shell: bash
        run: |
          set -euo pipefail
          OIDC_RESPONSE="$(
            curl --fail --silent --show-error \
              -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
              "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=paloma-data-supabase"
          )"
          OIDC_TOKEN="$(
            python -c 'import json,sys; print(json.load(sys.stdin)["value"])' \
              <<<"$OIDC_RESPONSE"
          )"
          DB_RESPONSE="$(
            curl --fail --silent --show-error -X POST \
              -H "Authorization: Bearer $OIDC_TOKEN" \
              -H "Content-Type: application/json" \
              "https://lighcnfzajgvfbdoekzt.supabase.co/functions/v1/paloma-data-credentials"
          )"
          SUPABASE_DB_URL="$(
            python -c 'import json,sys; print(json.load(sys.stdin)["database_url"])' \
              <<<"$DB_RESPONSE"
          )"
          test -n "$SUPABASE_DB_URL"
          echo "::add-mask::$SUPABASE_DB_URL"
          printf 'SUPABASE_DB_URL=%s\n' "$SUPABASE_DB_URL" >> "$GITHUB_ENV"
      - name: Monthly durable evidence refresh for the existing cohort
        if: github.event_name == 'schedule' && github.event.schedule == '30 14 1 * *'
        shell: bash
        run: |
          paloma-data sync-government
          if [ -z "$FSQ_CATALOG_URI" ] || [ -z "$FSQ_CATALOG_TOKEN" ] || [ -z "$FSQ_PLACES_TABLE" ]; then
            echo "FSQ OS is not configured; snapshot intentionally skipped"
          else
            paloma-data stage-source fsq --mode full
          fi
          paloma-data stage-source overture --mode full
          paloma-data stage-source wikidata --mode full
          paloma-data sync-neighborhoods
          if [ -n "$FSQ_PLACES_API_KEY" ] && [ "$FSQ_SERVER_STORAGE_LICENSED" = "true" ]; then
            paloma-data catalog-verify --limit 250 --existing-only
          else
            echo "Licensed server retention is not configured; proprietary verification skipped"
          fi
          paloma-data resolve-fields
          paloma-data pipeline-enqueue-catalog --include-suppressed --limit 50000
          if [ -n "$YELP_API_KEY" ]; then
            paloma-data pipeline-enqueue-provider-links --limit 250
          else
            echo "Yelp is not configured; proactive durable-ID sync skipped"
          fi
          paloma-data field-coverage

      - name: Twice-weekly regulatory reconciliation
        if: github.event_name == 'schedule' && github.event.schedule == '30 14 * * 1,4'
        shell: bash
        run: |
          paloma-data sync-government
          paloma-data resolve-fields
          paloma-data pipeline-enqueue-catalog --include-suppressed --limit 50000
          paloma-data field-coverage

      - name: Daily safety sweep enqueue
        if: github.event_name == 'schedule' && github.event.schedule == '45 14 * * *'
        run: paloma-data pipeline-enqueue-sweep

      - name: Authenticate deployment workflow to Google Cloud
        if: github.event_name == 'workflow_dispatch' && inputs.action == 'deploy-worker'
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud CLI
        if: github.event_name == 'workflow_dispatch' && inputs.action == 'deploy-worker'
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3

      - name: Deploy managed pipeline worker
        if: github.event_name == 'workflow_dispatch' && inputs.action == 'deploy-worker'
        shell: bash
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_REGION: ${{ vars.GCP_REGION }}
          GCP_ARTIFACT_REPOSITORY: ${{ vars.GCP_ARTIFACT_REPOSITORY }}
          GCP_RUNTIME_SERVICE_ACCOUNT: ${{ vars.GCP_RUNTIME_SERVICE_ACCOUNT }}
          GCP_DB_SECRET: ${{ vars.GCP_DB_SECRET }}
          GCP_YELP_SECRET: ${{ vars.GCP_YELP_SECRET }}
        run: deploy/gcp/deploy-worker.sh

      - name: Manual action
        if: github.event_name == 'workflow_dispatch' && inputs.action != 'deploy-worker'
        shell: bash
        env:
          ACTION: ${{ inputs.action }}
          SOURCE: ${{ inputs.source }}
          CITY: ${{ inputs.city }}
          LIMIT: ${{ inputs.limit }}
          CONFIRMATION: ${{ inputs.confirmation }}
          REVIEW_ID: ${{ inputs.review_id }}
          RESOLUTION: ${{ inputs.resolution }}
        run: |
          set -euo pipefail
          case "$ACTION" in
            status)
              paloma-data catalog-status
              ;;
            coverage)
              paloma-data field-coverage
              ;;
            resolve-fields)
              paloma-data resolve-fields
              ;;
            audit)
              paloma-data catalog-audit --city "$CITY" --limit "$LIMIT"
              ;;
            resolve-review)
              test "$CONFIRMATION" = "RESOLVE_MATCH_REVIEW"
              test -n "$REVIEW_ID"
              paloma-data catalog-review-resolve \
                --review-id "$REVIEW_ID" \
                --resolution "$RESOLUTION" \
                --confirm "$CONFIRMATION"
              ;;
            stage)
              paloma-data stage-source "$SOURCE" --mode full
              ;;
            neighborhoods)
              paloma-data sync-neighborhoods
              ;;
            discover)
              paloma-data catalog-discover --city "$CITY" --limit "$LIMIT"
              ;;
            trial)
              paloma-data catalog-trial --city "$CITY" --limit "$LIMIT"
              ;;
            trial-verified)
              paloma-data catalog-trial --city "$CITY" --limit "$LIMIT" --verified-only
              ;;
            verify)
              paloma-data catalog-verify --city "$CITY" --limit "$LIMIT"
              ;;
            reevaluate)
              paloma-data catalog-reevaluate --city "$CITY" --limit "$LIMIT"
              ;;
            publish)
              test "$CONFIRMATION" = "PUBLISH_VERIFIED"
              paloma-data catalog-publish --confirm "$CONFIRMATION" --limit "$LIMIT"
              ;;
            provider-links)
              paloma-data provider-links-sync \
                --provider yelp \
                --city "$CITY" \
                --limit "$LIMIT"
              ;;
            provider-audit)
              paloma-data provider-audit \
                --provider yelp \
                --city "$CITY" \
                --limit "$LIMIT"
              ;;
            queue-refresh)
              paloma-data pipeline-enqueue-catalog --city "$CITY" --limit "$LIMIT"
              ;;
            queue-work)
              paloma-data pipeline-worker \
                --drain \
                --max-jobs "$LIMIT" \
                --fail-on-error
              ;;
            queue-status)
              paloma-data pipeline-status
              ;;
            cutover)
              test "$CONFIRMATION" = "REPLACE_PUBLIC_CATALOG"
              paloma-data catalog-cutover --confirm "$CONFIRMATION" --minimum-verified "$LIMIT"
              ;;
          esac
