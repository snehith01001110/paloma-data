name: Establishment sync

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'pyproject.toml'
      - '.github/workflows/sync.yml'
  workflow_dispatch:
    inputs:
      mode:
        description: backfill or sync
        required: true
        default: sync
        type: choice
        options: [sync, backfill]
      source:
        description: Source to run
        required: true
        default: all
        type: choice
        options: [all, ca_abc, datasf, overture, fsq, web]
  schedule:
    # Government sources refresh frequently.
    - cron: '30 16 * * 1-5'
    # Overture and FSQ OS publish bulk releases monthly.
    - cron: '0 11 25 * *'

permissions:
  contents: read
  id-token: write

concurrency:
  group: paloma-establishment-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      PALOMA_COUNTRIES: US
      PALOMA_REGIONS: CA
      PALOMA_CITIES: San Francisco,Oakland,Berkeley,San Jose,San Mateo,Palo Alto,Mountain View,Sunnyvale,Santa Clara,Redwood City,Napa,Sonoma
      PALOMA_OVERTURE_BBOX: -123.2,36.8,-121.1,38.9
      FSQ_CATALOG_URI: ${{ vars.FSQ_CATALOG_URI }}
      FSQ_CATALOG_TOKEN: ${{ secrets.FSQ_CATALOG_TOKEN }}
      FSQ_PLACES_TABLE: ${{ vars.FSQ_PLACES_TABLE }}
      FSQ_CATALOG_WAREHOUSE: ${{ vars.FSQ_CATALOG_WAREHOUSE }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Exchange GitHub OIDC for scoped database credential
        shell: bash
        run: |
          set -euo pipefail
          OIDC_RESPONSE="$(
            curl --fail --silent --show-error \
              -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
              "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=paloma-data-supabase"
          )"
          OIDC_TOKEN="$(
            python -c 'import json,sys; print(json.load(sys.stdin)["value"])' \
              <<<"$OIDC_RESPONSE"
          )"
          DB_RESPONSE="$(
            curl --fail --silent --show-error -X POST \
              -H "Authorization: Bearer $OIDC_TOKEN" \
              -H "Content-Type: application/json" \
              "https://lighcnfzajgvfbdoekzt.supabase.co/functions/v1/paloma-data-credentials"
          )"
          SUPABASE_DB_URL="$(
            python -c 'import json,sys; print(json.load(sys.stdin)["database_url"])' \
              <<<"$DB_RESPONSE"
          )"
          test -n "$SUPABASE_DB_URL"
          echo "::add-mask::$SUPABASE_DB_URL"
          printf 'SUPABASE_DB_URL=%s\n' "$SUPABASE_DB_URL" >> "$GITHUB_ENV"
      - run: pip install '.[fsq]'
      # Deliberate no-op workflow touch: both GitHub-OIDC-gated Supabase functions are repaired;
      # this main push retriggers bootstrap when the resolver version advances.
      - name: Run initial sources and refresh field truth after deployment
        if: github.event_name == 'push'
        run: paloma-data bootstrap
      - name: Run weekday government reconciliation
        if: github.event_name == 'schedule' && github.event.schedule == '30 16 * * 1-5'
        run: paloma-data sync-government
      - name: Run monthly consumer-place reconciliation
        if: github.event_name == 'schedule' && github.event.schedule == '0 11 25 * *'
        shell: bash
        run: |
          paloma-data sync overture
          if [ -n "$FSQ_CATALOG_URI" ] && [ -n "$FSQ_CATALOG_TOKEN" ] && [ -n "$FSQ_PLACES_TABLE" ]; then
            paloma-data sync fsq
          else
            echo "FSQ OS skipped: configure the Places Portal catalog variables and token"
          fi
      - name: Run manual command
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          if [ "${{ inputs.source }}" = "web" ]; then
            paloma-data enrich-web
          elif [ "${{ inputs.mode }}" = "backfill" ]; then
            if [ "${{ inputs.source }}" = "all" ]; then
              paloma-data rebuild-catalog
            else
              paloma-data backfill "${{ inputs.source }}"
            fi
          else
            if [ "${{ inputs.source }}" = "all" ]; then
              paloma-data sync-all
            else
              paloma-data sync "${{ inputs.source }}"
            fi
          fi
