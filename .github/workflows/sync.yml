name: Verified establishment catalog

on:
  workflow_dispatch:
    inputs:
      action:
        description: Safe catalog action
        required: true
        default: status
        type: choice
        options: [status, stage, neighborhoods, discover, trial, verify, reevaluate, publish, cutover]
      source:
        description: Source for stage
        required: false
        default: ca_abc
        type: choice
        options: [ca_abc, datasf, fsq, overture]
      city:
        description: Exact city for discover/trial/verify
        required: false
        default: San Francisco
        type: string
      limit:
        description: Candidate/API call limit
        required: false
        default: '20'
        type: string
      confirmation:
        description: PUBLISH_VERIFIED or REPLACE_PUBLIC_CATALOG when required
        required: false
        default: ''
        type: string
  schedule:
    # ABC/DataSF are complete snapshots. A missing row is acted on only after a successful run.
    - cron: '30 16 * * 1-5'
    # FSQ OS publishes monthly; this discovers candidates but cannot publish them.
    - cron: '0 11 15 * *'
    # Refresh a bounded set of due/new candidates, then materialize only passing verifications.
    - cron: '0 15 * * 1'

permissions:
  contents: read
  id-token: write

concurrency:
  group: paloma-verified-catalog
  cancel-in-progress: false

jobs:
  catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      PALOMA_COUNTRIES: US
      PALOMA_REGIONS: CA
      PALOMA_CITIES: San Francisco,Oakland,Berkeley,San Jose,San Mateo,Palo Alto,Mountain View,Sunnyvale,Santa Clara,Redwood City,Napa,Sonoma
      PALOMA_OVERTURE_BBOX: -123.2,36.8,-121.1,38.9
      FSQ_CATALOG_URI: ${{ vars.FSQ_CATALOG_URI }}
      FSQ_CATALOG_TOKEN: ${{ secrets.FSQ_CATALOG_TOKEN }}
      FSQ_PLACES_TABLE: ${{ vars.FSQ_PLACES_TABLE }}
      FSQ_CATALOG_WAREHOUSE: ${{ vars.FSQ_CATALOG_WAREHOUSE }}
      FSQ_PLACES_API_KEY: ${{ secrets.FSQ_PLACES_API_KEY }}
      FSQ_SERVER_STORAGE_LICENSED: ${{ vars.FSQ_SERVER_STORAGE_LICENSED }}
      PALOMA_CATALOG_AUTO_PUBLISH: ${{ vars.PALOMA_CATALOG_AUTO_PUBLISH }}
      CATALOG_PROVIDER_LEASE_DAYS: '45'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Exchange GitHub OIDC for scoped database credential
        shell: bash
        run: |
          set -euo pipefail
          OIDC_RESPONSE="$(
            curl --fail --silent --show-error \
              -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
              "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=paloma-data-supabase"
          )"
          OIDC_TOKEN="$(
            python -c 'import json,sys; print(json.load(sys.stdin)["value"])' \
              <<<"$OIDC_RESPONSE"
          )"
          DB_RESPONSE="$(
            curl --fail --silent --show-error -X POST \
              -H "Authorization: Bearer $OIDC_TOKEN" \
              -H "Content-Type: application/json" \
              "https://lighcnfzajgvfbdoekzt.supabase.co/functions/v1/paloma-data-credentials"
          )"
          SUPABASE_DB_URL="$(
            python -c 'import json,sys; print(json.load(sys.stdin)["database_url"])' \
              <<<"$DB_RESPONSE"
          )"
          test -n "$SUPABASE_DB_URL"
          echo "::add-mask::$SUPABASE_DB_URL"
          printf 'SUPABASE_DB_URL=%s\n' "$SUPABASE_DB_URL" >> "$GITHUB_ENV"
      - run: pip install '.[fsq]'

      - name: Weekday regulatory reconciliation
        if: github.event_name == 'schedule' && github.event.schedule == '30 16 * * 1-5'
        run: |
          paloma-data sync-government
          paloma-data catalog-sweep

      - name: Monthly open-source discovery snapshot
        if: github.event_name == 'schedule' && github.event.schedule == '0 11 15 * *'
        shell: bash
        run: |
          if [ -z "$FSQ_CATALOG_URI" ] || [ -z "$FSQ_CATALOG_TOKEN" ] || [ -z "$FSQ_PLACES_TABLE" ]; then
            echo "FSQ OS is not configured; discovery intentionally skipped"
          else
            paloma-data sync fsq
          fi
          paloma-data sync-neighborhoods

      - name: Weekly verification refresh and guarded publication
        if: github.event_name == 'schedule' && github.event.schedule == '0 15 * * 1'
        shell: bash
        run: |
          if [ -n "$FSQ_PLACES_API_KEY" ] && [ "$FSQ_SERVER_STORAGE_LICENSED" = "true" ]; then
            paloma-data catalog-verify --limit 250
          else
            echo "Licensed server retention is not configured; proprietary verification skipped"
          fi
          paloma-data catalog-reevaluate
          if [ "$PALOMA_CATALOG_AUTO_PUBLISH" = "true" ]; then
            paloma-data catalog-publish --confirm PUBLISH_VERIFIED --limit 2000
          else
            echo "Automatic publication is disabled until the initial cutover is approved"
          fi
          paloma-data catalog-sweep

      - name: Manual action
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          ACTION: ${{ inputs.action }}
          SOURCE: ${{ inputs.source }}
          CITY: ${{ inputs.city }}
          LIMIT: ${{ inputs.limit }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          case "$ACTION" in
            status)
              paloma-data catalog-status
              ;;
            stage)
              paloma-data stage-source "$SOURCE" --mode full
              ;;
            neighborhoods)
              paloma-data sync-neighborhoods
              ;;
            discover)
              paloma-data catalog-discover --city "$CITY" --limit "$LIMIT"
              ;;
            trial)
              paloma-data catalog-trial --city "$CITY" --limit "$LIMIT"
              ;;
            verify)
              paloma-data catalog-verify --city "$CITY" --limit "$LIMIT"
              ;;
            reevaluate)
              paloma-data catalog-reevaluate --city "$CITY" --limit "$LIMIT"
              ;;
            publish)
              test "$CONFIRMATION" = "PUBLISH_VERIFIED"
              paloma-data catalog-publish --confirm "$CONFIRMATION" --limit "$LIMIT"
              ;;
            cutover)
              test "$CONFIRMATION" = "REPLACE_PUBLIC_CATALOG"
              paloma-data catalog-cutover --confirm "$CONFIRMATION" --minimum-verified "$LIMIT"
              ;;
          esac
