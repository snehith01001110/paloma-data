name: Set up Paloma data worker
description: Install the locked worker and exchange GitHub OIDC for the scoped ingest credential.

runs:
  using: composite
  steps:
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
      with:
        python-version: '3.12'
        cache: pip
    - name: Install locked runtime
      shell: bash
      run: |
        python -m pip install 'uv==0.11.6'
        uv sync --frozen --no-dev --extra fsq
        echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
    - name: Exchange GitHub OIDC for scoped database credential
      shell: bash
      run: |
        set -euo pipefail
        OIDC_RESPONSE="$(
          curl --fail --silent --show-error \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=paloma-data-supabase"
        )"
        OIDC_TOKEN="$(
          python -c 'import json,sys; print(json.load(sys.stdin)["value"])' \
            <<<"$OIDC_RESPONSE"
        )"
        DB_RESPONSE="$(
          curl --fail --silent --show-error -X POST \
            -H "Authorization: Bearer $OIDC_TOKEN" \
            -H "Content-Type: application/json" \
            "https://lighcnfzajgvfbdoekzt.supabase.co/functions/v1/paloma-data-credentials"
        )"
        SUPABASE_DB_URL="$(
          python -c 'import json,sys; print(json.load(sys.stdin)["database_url"])' \
            <<<"$DB_RESPONSE"
        )"
        test -n "$SUPABASE_DB_URL"
        echo "::add-mask::$SUPABASE_DB_URL"
        printf 'SUPABASE_DB_URL=%s\n' "$SUPABASE_DB_URL" >> "$GITHUB_ENV"
